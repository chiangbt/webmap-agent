allowBuilds:
  # @arcgis/core transitively ships a vaadin usage-statistics postinstall;
  # keep it disabled (telemetry) — esbuild remains the only build we allow.
  '@vaadin/vaadin-usage-statistics': false
  # pnpm 10+ blocks dependency build scripts by default; esbuild's postinstall
  # is the only one this project needs (it validates the platform binary).
  esbuild: true
minimumReleaseAgeExclude:
  - lucide-react@1.77.0
