# Gitea Actions CI（语法与 GitHub Actions 兼容）。
# 在 Gitea 仓库设置中启用 Actions 并挂载 act runner 后即生效；
# 若仓库镜像到 GitHub，把本文件复制到 .github/workflows/ 即可原样运行。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # CI 中密钥必须显式禁用 frozen-lockfile 以外的安装行为，保证
      # lockfile 与 package.json 一致才放行后续步骤。
      - run: pnpm install --frozen-lockfile

      # 三道门禁与本地验证一致：lint（含类型相关规则）、build（含
      # tsc -p tsconfig.build.json 的类型检查——此前坏提交进 main 的
      # 根因正是类型检查只藏在 build 里）、test。
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
